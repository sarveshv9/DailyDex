name: CI Safety Net

on:
  push:
    branches: [main, "refactor/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Test & Lint Ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Run Jest Unit Tests
        run: npm test

      - name: ESLint Ratchet Check
        run: node scripts/lint-ratchet.js

      - name: Verify No E2E Test Leak in Production Bundle
        run: |
          npx expo export -p android --no-bytecode
          if grep -rn "focus-start-debug-20s-btn" dist/; then
            echo "❌ Leak detected: focus-start-debug-20s-btn found in production bundle!"
            exit 1
          fi
          echo "✅ Production bundle clean: E2E debug button tree-shaken."
