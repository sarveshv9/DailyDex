appId: com.anonymous.Zenapp
---
# Flow 8: Timer-in-Background Check (Clock Drift Prevention)
- launchApp
- tapOn:
    text: ".*(Focus|Pomodoro|Start Timer|Timer).*"
# Start 20s debug timer (or regular start)
- tapOn:
    id: "focus-start-debug-20s-btn"
    optional: true
- tapOn:
    id: "focus-start-timer-btn"
    optional: true
- tapOn:
    id: "focus-play-pause-btn"
    optional: true

# Background app without killing it
- pressKey: Home

# Wait 10 seconds while backgrounded
- wait: 10000

# Resume app from background
- launchApp

# Verify countdown progressed by ~10 seconds from targetEndTime without clock drift
- assertVisible:
    text: ".*(Focus|Work|00:[0-1][0-9]|Session).*"
